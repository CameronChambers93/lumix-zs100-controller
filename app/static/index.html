<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeMeta" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Lumix</title>
<script>
  // Apply the saved theme before first paint (System / Light / Dark; "system" leaves data-theme to the media query).
  try { const t = JSON.parse(localStorage.getItem("theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #eeece7; --text: #1b1b1d; --muted: #6b6a66;
    --line: #e2e0da; --accent: #c8102e; --accent-text: #fff; --ok: #1f8a4c; --warn: #b26a00;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
    color-scheme: light;
  }
  /* The theme setting is applied as data-theme on <html>; with no setting ("System") the media query decides. */
  :root[data-theme="dark"] {
    --bg: #111214; --surface: #1a1b1e; --surface-2: #24262a; --text: #ecebe8; --muted: #9a9993;
    --line: #2c2e33; --accent: #e5334f; --ok: #3cc47a; --warn: #e5a03a; --shadow: none;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #111214; --surface: #1a1b1e; --surface-2: #24262a; --text: #ecebe8; --muted: #9a9993;
      --line: #2c2e33; --accent: #e5334f; --ok: #3cc47a; --warn: #e5a03a; --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); }
  .bar { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  #camText { overflow: hidden; text-overflow: ellipsis; }
  .pill { min-width: 0; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
    background: var(--surface-2); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill.on { color: var(--text); } .pill.on .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .spacer { flex: 1; }
  .icon-btn { color: var(--text); border: 0; background: transparent; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    text-decoration: none; flex: none; }
  .icon-btn[hidden] { display: none; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 20px; height: 20px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin: 4px 0 16px; }
  .sync { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sync h2 { margin: 0; font-size: 17px; }
  .sync p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .sync .text { flex: 1; min-width: 180px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn:disabled { opacity: .45; cursor: default; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 12px; width: 100%; }
  .progress b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .errors { color: var(--warn); font-size: 13px; margin-top: 8px; width: 100%; }
  .notice { color: var(--muted); font-size: 13px; }
  .notice ol { margin: 6px 0 0; padding-left: 20px; }

  .toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .toolbar .btn { padding: 7px 12px; font-size: 14px; white-space: nowrap; }
  @media (max-width: 420px) { .toolbar { gap: 6px; } .toolbar .seg button { padding: 6px 7px; font-size: 13px; } .toolbar .btn { padding: 7px 9px; font-size: 13px; } .toolbar .wide { display: none; } }
  .toolbar.second { margin-bottom: 12px; }
  .searchbar { margin: 0 0 10px; }
  .menu { position: absolute; z-index: 7; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 30px rgb(0 0 0 / .2); padding: 4px; min-width: 160px; }
  .menu[hidden] { display: none; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
  .menu button.on { font-weight: 700; color: var(--accent); }
  .menu button:hover { background: var(--surface-2); }
  .day { position: sticky; top: var(--hdr, 60px); z-index: 4; margin: 0; padding: 8px 2px 6px; font-size: 14px; font-weight: 700;
    background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 40px; }
  @supports (background: color-mix(in srgb, red, blue)) {
    header { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .day { background: color-mix(in srgb, var(--bg) 92%, transparent); }
  }
  .day-group { margin-bottom: 8px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .count { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 4px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; } }
  .tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; transform: scale(1.13); }
  /* The camera's 160x120 thumbnails letterbox 3:2 photos; the zoom crops the black bars. */
  .tile img.loaded { opacity: 1; }
  .tile .badge { position: absolute; right: 5px; bottom: 5px; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center; background: rgb(0 0 0 / .55); color: #fff; }
  .tile .badge svg { width: 12px; height: 12px; }
  .tile .badge.ok { background: var(--ok); }
  .tile .vid { position: absolute; left: 5px; bottom: 5px; padding: 1px 6px; border-radius: 6px; background: rgb(0 0 0 / .6); color: #fff; font-size: 11px; }
  .tile .vid[hidden] { display: none; }
  .tile .check { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
    background: rgb(0 0 0 / .25); display: none; place-items: center; color: #fff; }
  .selecting .tile .check { display: grid; }
  .tile.sel .check { background: var(--accent); border-color: var(--accent); }
  .tile.sel::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); border-radius: 6px; }
  .tile.sel img { filter: brightness(.8); }
  .tile .check svg { width: 13px; height: 13px; opacity: 0; } .tile.sel .check svg { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .grid, .tile { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tile img { pointer-events: none; -webkit-user-drag: none; }
  .selecting .wrap { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  .daycheck { display: none; flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid var(--muted);
    background: transparent; color: #fff; place-items: center; position: relative; }
  .daycheck::before { content: ""; position: absolute; inset: -8px; }   /* bigger touch target */
  .daycheck svg { width: 13px; height: 13px; opacity: 0; }
  .selecting .daycheck { display: grid; }
  .daycheck.on { background: var(--accent); border-color: var(--accent); } .daycheck.on svg { opacity: 1; }

  .ptr { position: fixed; left: 50%; top: var(--hdr, 60px); z-index: 4; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center;
    transform: translateY(-48px); opacity: 0; pointer-events: none; color: var(--muted); }
  .ptr svg { width: 18px; height: 18px; transition: transform .15s; } .ptr.ready svg { transform: rotate(180deg); }
  .ptr.busy svg { display: none; } .ptr .spin { display: none; margin: 0; border-color: var(--line); border-top-color: var(--accent); }
  .ptr.busy .spin { display: block; }
  .ptr.anim { transition: transform .2s, opacity .2s; }

  .fast { position: fixed; right: 0; top: 0; bottom: 0; width: 0; z-index: 6; pointer-events: none; }
  .fast-thumb { position: absolute; right: 0; top: 0; width: 44px; height: 56px; pointer-events: none; touch-action: none; opacity: 0; transition: opacity .25s; }
  .fast.show .fast-thumb { opacity: 1; pointer-events: auto; }
  .fast-thumb::after { content: ""; position: absolute; right: 8px; top: 8px; width: 6px; height: 40px; border-radius: 3px; background: var(--muted); opacity: .8; transition: width .15s, background .15s; }
  .fast.drag .fast-thumb::after { width: 10px; background: var(--accent); opacity: 1; }
  .fast-bubble { position: absolute; right: 40px; top: 0; padding: 6px 12px; border-radius: 10px; background: var(--text); color: var(--bg);
    font-size: 14px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .fast.drag .fast-bubble { opacity: 1; }

  .selbar { position: fixed; left: 50%; transform: translate(-50%, 150%); bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 30px rgb(0 0 0 / .2); border-radius: 16px;
    padding: 10px 10px 10px 16px; display: none; gap: 8px; align-items: center; flex-wrap: wrap; transition: transform .2s; width: min(560px, calc(100% - 32px)); z-index: 6; }
  .selbar.show { transform: translate(-50%, 0); display: flex; }
  .selbar .n { flex: 1 1 40%; font-weight: 600; }
  .selbar .btn { padding: 8px 12px; flex: 1 1 40%; }
  .selbar #selAll { flex: 0 0 auto; }

  .lightbox { position: fixed; inset: 0; background: #0b0b0c; z-index: 10; display: none; flex-direction: column; color: #fff; }
  .lightbox.show { display: flex; }
  .lb-top, .lb-bottom { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .lb-top { padding-top: calc(10px + env(safe-area-inset-top)); }
  .lb-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom)); justify-content: center; flex-wrap: wrap; }
  .lb-top .name { flex: 1; min-width: 0; font-size: 14px; } .lb-top .name small { display: block; color: #aaa; }
  .lightbox .icon-btn { color: #fff; } .lightbox .icon-btn:hover { background: rgb(255 255 255 / .1); }
  .lb-stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; touch-action: none; overflow: hidden; }
  .lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-stage img { transform-origin: 50% 50%; will-change: transform; user-select: none; -webkit-user-drag: none; }
  .lb-stage img.snap { transition: transform .2s ease-out; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgb(255 255 255 / .1) !important; z-index: 2; }
  .lb-nav.prev { left: 8px; } .lb-nav.next { right: 8px; }
  @media (hover: none) { .lb-nav { display: none; } }
  .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .35); border-top-color: #fff;
    animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lb-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; max-height: 70%; overflow-y: auto; background: var(--surface); color: var(--text);
    border-radius: 16px 16px 0 0; padding: 14px 18px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgb(0 0 0 / .35);
    width: min(560px, 100%); margin: 0 auto; }
  .lb-info[hidden] { display: none; }
  .lb-info h3 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
  .lb-info h3 .icon-btn { color: var(--text); }
  .lb-info dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 14px; }
  .lb-info dt { color: var(--muted); } .lb-info dd { margin: 0; overflow-wrap: anywhere; }
  .lb-info dd a { color: var(--accent); }
  .lb-info .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .lightbox .btn { background: rgb(255 255 255 / .12); border-color: transparent; color: #fff; text-decoration: none; }
  .lightbox .btn.primary { background: var(--accent); }
  .lightbox .btn[hidden] { display: none; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); padding: 20px; width: min(420px, calc(100% - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h3 { margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .row .primary { order: 2; }   /* first in the DOM so Enter in a field saves, shown last */
  dialog .btn { padding: 8px 14px; }
  #findOut { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
  .toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i></i>Lumix</div>
    <span class="pill" id="camPill"><span class="dot"></span><span id="camText">Connecting…</span></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="searchBtn" title="Search" aria-label="Search" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="icon-btn" id="refreshBtn" title="Refresh from camera" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section class="card" id="syncCard">
    <div class="sync">
      <div class="text"><h2 id="syncTitle">…</h2><p id="syncSub"></p></div>
      <button class="btn" id="cancelBtn" hidden>Cancel</button>
      <button class="btn primary" id="syncBtn" disabled>Copy to PC</button>
      <div class="progress" id="progress" hidden><b></b></div>
      <div class="errors" id="errors" hidden></div>
    </div>
    <div class="notice" id="offlineHelp" hidden>
      <ol>
        <li>On the camera: <b>Wi-Fi</b> → <b>New Connection</b> → <b>Remote Shooting &amp; View</b>.</li>
        <li>Connect <b>Via Network</b> to your home Wi-Fi and leave it on the waiting screen.</li>
        <li>This page reconnects on its own within a few seconds.</li>
      </ol>
    </div>
  </section>

  <div class="searchbar" id="searchBar" hidden>
    <input id="searchIn" type="search" aria-label="Search file names" placeholder="Search file names" autocomplete="off">
  </div>
  <div class="toolbar">
    <div class="seg" id="filter" role="group" aria-label="Show">
      <button data-f="all" class="on" aria-pressed="true">All</button><button data-f="new" aria-pressed="false">Not on PC</button><button data-f="local" aria-pressed="false">On PC</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="sortBtn" aria-haspopup="menu" aria-expanded="false">Newest first</button>
    <button class="btn" id="selectBtn">Select</button>
  </div>
  <div class="toolbar second">
    <div class="seg" id="kindFilter" role="group" aria-label="Type">
      <button data-k="all" class="on" aria-pressed="true">All</button><button data-k="photo" aria-pressed="false">Photos</button><button data-k="video" aria-pressed="false">Videos</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="menu" id="sortMenu" role="menu" hidden>
    <button role="menuitem" data-s="desc">Newest first</button><button role="menuitem" data-s="asc">Oldest first</button>
  </div>
  <div id="days"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="ptr" id="ptr" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span class="spin"></span>
</div>
<div class="fast" id="fast" aria-hidden="true">
  <div class="fast-bubble" id="fastBubble"></div>
  <div class="fast-thumb" id="fastThumb"></div>
</div>
<div class="selbar" id="selbar">
  <span class="n" id="selN">0 selected</span>
  <button class="btn" id="selAll">Select all</button>
  <button class="btn" id="selSave" title="Copy the selected files to the PC">To PC</button>
  <button class="btn primary" id="selDl">Download</button>
</div>

<div class="lightbox" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top">
    <div class="name" id="lbName"></div>
    <button class="icon-btn" id="lbInfoBtn" aria-label="Details" title="Details" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg></button>
    <a class="icon-btn" id="lbOpen" aria-label="Open in a new tab" title="Open in a new tab" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <button class="icon-btn" id="lbClose" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="icon-btn lb-nav prev" id="lbPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="icon-btn lb-nav next" id="lbNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="lb-info" id="lbInfo" role="region" aria-label="Details" hidden>
    <h3>Details <button class="icon-btn" id="lbInfoClose" aria-label="Close details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <dl id="lbInfoList"></dl>
    <p class="note" id="lbInfoNote" hidden></p>
  </div>
  <div class="lb-bottom">
    <button class="btn" id="lbFull" hidden>Full size</button>
    <button class="btn" id="lbSave" hidden>Copy to PC</button>
    <a class="btn primary" id="lbDl">Download</a>
  </div>
</div>

<dialog id="settings">
  <form method="dialog">
    <h3>Settings</h3>
    <label for="ipIn">Camera IP address</label>
    <input id="ipIn" inputmode="decimal" autocomplete="off" placeholder="10.0.0.220">
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="findBtn" type="button">Find camera</button></div>
    <div id="findOut" role="status"></div>
    <label>Theme</label>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button type="button" data-t="system" class="on" aria-pressed="true">System</button><button type="button" data-t="light" aria-pressed="false">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button>
    </div>
    <label>Saving to</label>
    <div id="libPath"></div>
    <div class="row"><button class="btn primary" id="saveIp" value="save">Save</button><button class="btn" value="cancel">Cancel</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const pick = (v, ok, d) => ok.includes(v) ? v : d;
let items = [], byId = new Map(), rawRows = [], rowsSig = "", status = null;
let filter = pick(store.get("filter", "all"), ["all", "new", "local"], "all");
let kindFilter = pick(store.get("kind", "all"), ["all", "photo", "video"], "all");
let sortDir = pick(store.get("sort", "desc"), ["desc", "asc"], "desc");
let query = "", selecting = false, sel = new Set(), lbIndex = -1, lbId = null, lastItemsKey = "", lastItemsAt = 0, retryN = 0;

const fmtBytes = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(0) + " MB" : (b / 1e3).toFixed(0) + " KB";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---- dates (the camera has none in its listing; the server collects them. Local time, no zone.)
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function parseCamDate(s) {
  const m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+):(\d+)/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0;
}
const fmtDate = (ms) => { const d = new Date(ms); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateTime = (ms) => { const d = new Date(ms); return `${fmtDate(ms)}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const fmtDur = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function dayLabel(ms) {
  if (!ms) return "Date unknown";
  const d = new Date(ms), n = new Date();
  const diff = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  const base = `${d.getDate()} ${MON[d.getMonth()]}`;
  return d.getFullYear() === n.getFullYear() ? `${DOW[d.getDay()]} ${base}` : `${base} ${d.getFullYear()}`;
}
const dayKey = (ms) => { if (!ms) return "?"; const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const idCmp = (a, b) => /^\d+$/.test(a.id) && /^\d+$/.test(b.id) ? a.id - b.id : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
const isSaved = (i) => i.local;

// The server's rows -> items. Items still without a date sit next to their neighbours by id (ids increase with time)
// and share their day.
function mergeItems() {
  const out = rawRows.map((r) => { const ms = parseCamDate(r.date); return { ...r, date: ms, dateKnown: !!ms }; });
  const asc = out.filter((i) => /^\d+$/.test(i.id)).sort((a, b) => a.id - b.id);
  let lo = 0;
  for (const it of asc) { if (it.dateKnown) lo = it.date; else it.date = lo; }   // from the previous dated item...
  let hi = 0;
  for (let n = asc.length - 1; n >= 0; n--) { const it = asc[n]; if (it.dateKnown) hi = it.date; else if (!it.date) it.date = hi; }   // ...else the next
  items = out;
  byId = new Map(out.map((i) => [i.id, i]));
}

// ---- status
let pollTimer = 0;
async function poll() {
  clearTimeout(pollTimer);
  try { status = await api("/api/status"); renderStatus(); }
  catch { $("camText").textContent = "Server unreachable"; $("camPill").classList.remove("on"); }
  pollTimer = setTimeout(poll, status?.sync.running ? 1500 : 4000);
}
function renderStatus() {
  const c = status.camera, s = status.sync;
  $("camPill").classList.toggle("on", c.online);
  $("camText").textContent = c.online ? `ZS100 · battery ${c.battery || "?"}` : c.searching ? "Searching for the camera…" : "Camera offline";
  $("offlineHelp").hidden = c.online || s.running;
  $("progress").hidden = !s.running;
  $("cancelBtn").hidden = !s.running;
  $("syncBtn").hidden = s.running;
  if (s.running) {
    const pct = s.total_bytes ? (100 * s.bytes / s.total_bytes) : 0;
    $("progress").firstElementChild.style.width = pct.toFixed(1) + "%";
    $("syncTitle").textContent = `Copying ${Math.min(s.done + 1, s.total)} of ${s.total}`;
    $("syncSub").textContent = `${fmtBytes(s.bytes)} of ${fmtBytes(s.total_bytes)} · ${s.current}`;
  } else if (!c.online) {
    $("syncTitle").textContent = c.searching ? "Searching for the camera…" : "Camera not connected";
    $("syncSub").textContent = c.searching ? `Not at ${c.ip}, checking the rest of your network.`
      : c.error && c.error.includes("another device") ? c.error
      : `${plural(status.library.count, "file")} on the PC. Looking for the camera at ${c.ip}; if it moved, the PC finds it on its own.`;
  } else if (status.missing) {
    $("syncTitle").textContent = `${plural(status.missing, "new file")} on the camera`;
    $("syncSub").textContent = `Copies to ${status.library.path}`;
  } else {
    $("syncTitle").textContent = "All caught up";
    $("syncSub").textContent = `All ${plural(status.on_camera, "file")} on the camera are on the PC.`;
  }
  $("syncBtn").disabled = !c.online || !status.missing;
  $("syncBtn").textContent = status.missing ? `Copy ${status.missing} to PC` : "Copy to PC";
  const errs = s.errors || [];
  $("errors").hidden = !errs.length;
  $("errors").textContent = errs.length ? `${plural(errs.length, "problem")}: ${errs.slice(-3).join(" · ")}` : "";
  // Reload the grid when the camera's contents or the library change; while the server is still learning capture dates, every 10 s.
  const key = `${c.online}|${status.on_camera}|${status.library.count}|${status.missing}`;
  const filling = c.online && rawRows.some((r) => !r.date) && Date.now() - lastItemsAt > 10000;
  if (key !== lastItemsKey || filling) { lastItemsKey = key; loadItems(); }
  updateSel(); if (lbIndex >= 0) updateLbButtons();
}

// ---- grid
async function loadItems() {
  lastItemsAt = Date.now();
  try {
    const rows = (await api("/api/items")).items;
    const sig = JSON.stringify(rows);
    if (sig === rowsSig) { retryThumbs(); return; }
    rowsSig = sig; rawRows = rows; render();
  } catch (e) { toast(e.message); }
}
function visible() {
  const q = query.trim().toLowerCase(), dir = sortDir === "desc" ? -1 : 1;
  return items.filter((i) => (filter === "all" || (filter === "new" ? !isSaved(i) : isSaved(i)))
    && (kindFilter === "all" || i.kind === kindFilter) && (!q || i.name.toLowerCase().includes(q)))
    .sort((a, b) => ((a.date - b.date) || idCmp(a, b)) * dir);
}
// Thumbnails that failed (camera off, nothing cached) are tried again once the camera is back.
function retryThumbs() {
  if (!status?.camera.online) return;
  $("days").querySelectorAll("img[data-err]").forEach((img) => {
    if ((+img.dataset.err) >= 3) return;
    img.dataset.err = (+img.dataset.err) + 1; img.style.display = "";
    img.src = `/thumb/${img.parentElement.dataset.id}?r=${++retryN}`;
  });
}
function tileFor(it) {
  const el = document.createElement("button");
  el.className = "tile"; el.dataset.id = it.id;
  el.innerHTML = `<img loading="lazy" decoding="async" alt=""><span class="vid"></span><span class="badge"></span><span class="check">${ICON_OK}</span>`;
  const img = el.querySelector("img");
  img.onload = () => { img.classList.add("loaded"); delete img.dataset.err; };
  img.onerror = () => { img.dataset.err = img.dataset.err || 0; img.style.display = "none"; };
  img.alt = it.name;
  img.src = `/thumb/${it.id}`;
  return el;
}
function updateTile(it, el) {
  if (!el) return;
  const b = el.querySelector(".badge"), ok = isSaved(it), v = el.querySelector(".vid");
  b.className = "badge" + (ok ? " ok" : ""); b.innerHTML = ok ? ICON_OK : ICON_CAM;
  b.title = ok ? "On the PC" : "Only on the camera";
  v.hidden = it.kind !== "video"; v.textContent = it.kind === "video" ? "▶ " + (it.dur ? fmtDur(it.dur) : "video") : "";
  el.classList.toggle("sel", sel.has(it.id));
  el.setAttribute("aria-label", [it.name, it.kind, it.dateKnown && it.date ? fmtDate(it.date) : "", ok ? "on the PC" : "on the camera"].filter(Boolean).join(", "));
  if (selecting) el.setAttribute("aria-pressed", sel.has(it.id)); else el.removeAttribute("aria-pressed");
}
function emptyText() {
  if (!items.length) return status?.camera.online ? "Reading the camera…" : "No photos yet. Connect the camera to start.";
  const noun = kindFilter === "photo" ? "photos" : kindFilter === "video" ? "videos" : "files";
  if (query.trim()) return `No ${noun} match "${query.trim()}".`;
  if (filter === "new") return status?.camera.online ? `No ${noun} are missing from the PC.` : `Nothing to show here while the camera is offline.`;
  if (filter === "local") return `No ${noun} on the PC yet.`;
  return `No ${noun} to show.`;
}
const tiles = new Map();
let visIds = [], visIdx = new Map(), groups = [], dayBtns = [], renderLater = false;
function render() {
  if (drag) { renderLater = true; return; }   // replacing the tiles under a finger would cancel the touch
  mergeItems();
  const list = visible(), host = $("days");
  $("count").textContent = plural(list.length, "item");
  $("empty").hidden = list.length > 0;
  $("empty").textContent = emptyText();
  const frag = document.createDocumentFragment();
  let key = null, grid = null;
  visIds = list.map((i) => i.id); visIdx = new Map(visIds.map((id, n) => [id, n]));
  groups = []; dayBtns = [];
  for (const it of list) {
    const k = dayKey(it.date);
    if (k !== key) {
      key = k;
      const sec = document.createElement("section"); sec.className = "day-group";
      const h = document.createElement("h3"); h.className = "day";
      const label = dayLabel(it.date);
      const cb = document.createElement("button"); cb.className = "daycheck"; cb.dataset.g = groups.length; cb.innerHTML = ICON_OK;
      cb.setAttribute("aria-label", `Select all from ${label}`); cb.setAttribute("aria-pressed", "false");
      const sp = document.createElement("span"); sp.textContent = label;
      h.append(cb, sp);
      groups.push({ ids: [], month: it.date ? `${MON[new Date(it.date).getMonth()]} ${new Date(it.date).getFullYear()}` : "Date unknown" }); dayBtns.push(cb);
      grid = document.createElement("div"); grid.className = "grid";
      sec.append(h, grid); frag.appendChild(sec);
    }
    groups[groups.length - 1].ids.push(it.id);
    let el = tiles.get(it.id);
    if (!el) { el = tileFor(it); tiles.set(it.id, el); }
    updateTile(it, el);
    grid.appendChild(el);
  }
  host.replaceChildren(frag);
  if (lbIndex >= 0) { const i = list.findIndex((x) => x.id === lbId); if (i >= 0) lbIndex = i; updateLbButtons(); }
  retryThumbs(); updateSel(); measureFast();
}
$("days").addEventListener("click", (e) => {
  const cb = e.target.closest(".daycheck");
  if (cb) return toggleDay(+cb.dataset.g);
  if (suppressClick) { suppressClick = false; return; }   // the release that ended a long press / drag-select
  const el = e.target.closest(".tile"); if (!el) return;
  const id = el.dataset.id;
  if (selecting) { sel.has(id) ? sel.delete(id) : sel.add(id); updateTile(byId.get(id), el); updateSel(); }
  else openLb(visible().findIndex((i) => i.id === id));
});
function setSegState(el, attr, val) { [...el.children].forEach((x) => { const on = x.dataset[attr] === val; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); }); }
$("filter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; store.set("filter", filter); setSegState($("filter"), "f", filter); render();
});
$("kindFilter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  kindFilter = b.dataset.k; store.set("kind", kindFilter); setSegState($("kindFilter"), "k", kindFilter); render();
});
setSegState($("filter"), "f", filter); setSegState($("kindFilter"), "k", kindFilter);
function setSort(d) {
  sortDir = d; store.set("sort", d);
  $("sortBtn").innerHTML = (d === "desc" ? "Newest" : "Oldest") + '<span class="wide"> first</span>';
  [...$("sortMenu").children].forEach((x) => x.classList.toggle("on", x.dataset.s === d));
}
setSort(sortDir);
function showSortMenu(on) {
  const m = $("sortMenu"), r = $("sortBtn").getBoundingClientRect();
  m.hidden = !on; $("sortBtn").setAttribute("aria-expanded", on);
  if (on) { m.style.top = (r.bottom + window.scrollY + 4) + "px"; m.style.right = (document.documentElement.clientWidth - r.right) + "px"; }
}
$("sortBtn").onclick = (e) => { e.stopPropagation(); showSortMenu($("sortMenu").hidden); };
$("sortMenu").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; setSort(b.dataset.s); showSortMenu(false); render(); });
document.addEventListener("click", () => { if (!$("sortMenu").hidden) showSortMenu(false); });
function toggleSearch() {
  const on = $("searchBar").hidden;
  $("searchBar").hidden = !on; $("searchBtn").setAttribute("aria-expanded", on);
  if (on) $("searchIn").focus(); else { $("searchIn").value = ""; query = ""; render(); }
  setHdr();
}
$("searchBtn").onclick = toggleSearch;
$("searchIn").addEventListener("input", () => { query = $("searchIn").value; render(); });
const setHdr = () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
window.addEventListener("resize", setHdr); setHdr();

// ---- selection
function refreshTiles() { for (const it of items) { const el = tiles.get(it.id); if (el && el.isConnected) updateTile(it, el); } }
function setSelecting(on) {
  selecting = on; sel.clear();
  document.body.classList.toggle("selecting", on);
  $("selectBtn").textContent = on ? "Done" : "Select";
  refreshTiles(); updateSel();
}
function updateSel() {
  const chosen = items.filter((i) => sel.has(i.id));
  const copyable = chosen.filter((i) => !isSaved(i)).length;
  const allSel = visIds.length > 0 && visIds.every((id) => sel.has(id));
  $("selN").textContent = `${sel.size} selected`;
  $("selbar").classList.toggle("show", selecting);
  $("selAll").textContent = allSel ? "Clear" : `Select all ${visIds.length}`;
  $("selSave").textContent = copyable ? `Copy ${copyable} to PC` : "To PC";
  $("selSave").disabled = !copyable || !status?.camera.online || !!status?.sync.running;
  $("selDl").disabled = !sel.size;
  groups.forEach((gr, n) => {
    const on = gr.ids.length > 0 && gr.ids.every((id) => sel.has(id));
    dayBtns[n].classList.toggle("on", on); dayBtns[n].setAttribute("aria-pressed", on);
  });
}
function toggleDay(n) {
  const ids = groups[n]?.ids || [], all = ids.every((id) => sel.has(id));
  ids.forEach((id) => all ? sel.delete(id) : sel.add(id));
  ids.forEach((id) => { const it = byId.get(id), el = tiles.get(id); if (it && el) updateTile(it, el); });
  updateSel();
}
$("selectBtn").onclick = () => setSelecting(!selecting);
// "Select all N" covers everything matching the current filters, not just what has loaded on screen.
$("selAll").onclick = () => {
  const all = visIds.length > 0 && visIds.every((id) => sel.has(id));
  visIds.forEach((id) => all ? sel.delete(id) : sel.add(id));
  refreshTiles(); updateSel();
  if (!all) toast(`Selected all ${visIds.length}`);
};
$("selDl").onclick = () => {
  const ids = [...sel];
  if (ids.length === 1) location.href = `/media/${ids[0]}?dl`;
  else { location.href = `/zip?ids=${ids.join(",")}`; toast(`Preparing a zip of ${ids.length} files…`); }
};
$("selSave").onclick = async () => {
  const ids = items.filter((i) => sel.has(i.id) && !isSaved(i)).map((i) => i.id);
  try {
    const r = await api("/api/sync", { ids });
    toast(r.started ? "Copying to PC…" : "A copy is already running");
    setSelecting(false); poll();
  } catch (e) { toast(e.message); }
};

// Long press (450 ms) starts selecting; keep the finger (or mouse button) down and drag to select the range from that tile to
// the one under the pointer, scrolling when near the top or bottom edge. With the mouse in select mode, dragging starts at once.
const LONG_PRESS_MS = 450;
let lp = null, drag = null, suppressClick = false;
function tileIdxAt(x, y) {
  const el = document.elementFromPoint(x, y)?.closest?.(".tile");
  return el ? visIdx.get(el.dataset.id) : undefined;
}
function cancelLp() { if (lp) { clearTimeout(lp.timer); lp = null; } }
function applyRange(cur) {
  const d = drag, lo = Math.min(d.anchor, cur), hi = Math.max(d.anchor, cur);
  const plo = Math.min(d.anchor, d.last), phi = Math.max(d.anchor, d.last);
  d.last = cur;
  for (let i = Math.min(lo, plo); i <= Math.max(hi, phi); i++) {
    const id = visIds[i], inR = i >= lo && i <= hi;
    const want = d.mode === "add" ? (d.base.has(id) || inR) : (d.base.has(id) && !inR);
    if (sel.has(id) === want) continue;
    want ? sel.add(id) : sel.delete(id);
    const it = byId.get(id), el = tiles.get(id); if (it && el) updateTile(it, el);
  }
  updateSel();
}
function startDrag() {
  const l = lp; lp = null; if (!l) return;
  const anchor = visIdx.get(l.id); if (anchor === undefined) return;
  const was = selecting && sel.has(l.id);
  if (!selecting) setSelecting(true);
  drag = { anchor, last: anchor, mode: was ? "remove" : "add", base: new Set(sel), x: l.x, y: l.y, dirty: false, raf: 0 };
  suppressClick = true;
  try { navigator.vibrate?.(10); } catch {}
  applyRange(anchor);
  dragTick();
}
function dragTick() {
  const d = drag; if (!d) return;
  const top = document.querySelector("header").offsetHeight + 56, bot = innerHeight - 130;
  const v = d.y < top ? -Math.min(1, (top - d.y) / 56) : d.y > bot ? Math.min(1, (d.y - bot) / 130) : 0;
  if (v) { window.scrollBy(0, Math.round(v * 22)); d.dirty = true; }   // up to ~1300 px/s
  // The bar and header cover the edge zones, so hit-test just inside them while the pointer is out there.
  if (d.dirty) { d.dirty = false; const i = tileIdxAt(d.x, Math.min(Math.max(d.y, top), bot)); if (i !== undefined && i !== d.last) applyRange(i); }
  d.raf = requestAnimationFrame(dragTick);
}
function endDrag() {
  if (!drag) return;
  cancelAnimationFrame(drag.raf);
  if (drag.dirty) { const i = tileIdxAt(drag.x, drag.y); if (i !== undefined && i !== drag.last) applyRange(i); }   // released before the next frame
  drag = null;
  if (renderLater) { renderLater = false; render(); }
}
$("days").addEventListener("pointerdown", (e) => {
  suppressClick = false;
  if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
  const el = e.target.closest?.(".tile");
  cancelLp();
  if (!el || !e.isPrimary) return;
  lp = { id: el.dataset.id, x: e.clientX, y: e.clientY, mouse: e.pointerType === "mouse", timer: setTimeout(startDrag, LONG_PRESS_MS) };
});
$("days").addEventListener("pointermove", (e) => {
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) {
    if (lp.mouse && selecting) {   // a mouse doesn't scroll by dragging: start once the pointer reaches another tile
      if (tileIdxAt(e.clientX, e.clientY) !== visIdx.get(lp.id)) {
        clearTimeout(lp.timer); startDrag();
        if (drag) { drag.x = e.clientX; drag.y = e.clientY; drag.dirty = true; }   // apply this move too, not just later ones
      }
    }
    else cancelLp();   // it is a scroll, not a press
  }
  if (drag && e.isPrimary) { drag.x = e.clientX; drag.y = e.clientY; drag.dirty = true; }
});
for (const t of ["pointerup", "pointercancel"]) $("days").addEventListener(t, () => { cancelLp(); endDrag(); });
window.addEventListener("pointerup", () => { cancelLp(); endDrag(); });   // released outside the grid (mouse)
$("days").addEventListener("dragstart", (e) => e.preventDefault());   // a native image drag would cancel the pointer
$("days").addEventListener("contextmenu",(e) => { if (matchMedia("(pointer: coarse)").matches) e.preventDefault(); });

// Pull to refresh (touch devices): at the top of the page, drag down past the threshold and let go. Not while selecting or in the viewer.
let pull = null, refreshing = false;
const ptrEl = $("ptr"), PTR_AT = 64;
function ptrShow(y, ready) {
  ptrEl.classList.remove("anim"); ptrEl.classList.toggle("ready", ready);
  ptrEl.style.transform = `translateY(${y - 48}px)`; ptrEl.style.opacity = Math.min(1, y / 40);
}
function ptrHide() { ptrEl.classList.add("anim"); ptrEl.classList.remove("ready", "busy"); ptrEl.style.transform = ""; ptrEl.style.opacity = ""; }
document.addEventListener("touchstart", (e) => {
  const blocked = selecting || lbIndex >= 0 || drag || refreshing || document.querySelector("dialog[open]") || e.touches.length !== 1
    || window.scrollY > 0 || e.target.closest?.("#fast, #sortMenu, input");
  pull = blocked ? null : { y0: e.touches[0].clientY, x0: e.touches[0].clientX, active: false, d: 0 };
}, { passive: true });
document.addEventListener("touchmove", (e) => {
  if (drag) { if (e.cancelable) e.preventDefault(); return; }   // drag-select must not scroll the page
  if (!pull) return;
  const dy = e.touches[0].clientY - pull.y0, dx = e.touches[0].clientX - pull.x0;
  if (window.scrollY > 0 || e.touches.length !== 1) { pull = null; return; }
  if (!pull.active) {
    if (dy < -8) { pull = null; return; }
    if (dy < 12 || dy < Math.abs(dx) * 1.5) return;
    pull.active = true; cancelLp();
  }
  if (e.cancelable) e.preventDefault();
  pull.d = Math.min(96, (dy - 12) * 0.5);
  ptrShow(pull.d, pull.d >= PTR_AT);
}, { passive: false });
async function endPull(e) {
  const p = pull; pull = null;
  if (!p || !p.active) return;
  if (p.d >= PTR_AT && e.type === "touchend" && !refreshing) {
    refreshing = true; ptrEl.classList.add("anim", "busy"); ptrEl.style.transform = "translateY(8px)"; ptrEl.style.opacity = 1;
    try { await refresh(); } finally { refreshing = false; ptrHide(); }
  } else ptrHide();
}
document.addEventListener("touchend", endPull);
document.addEventListener("touchcancel", endPull);

// Fast scroll: a draggable thumb on the right edge while scrolling; the bubble shows the month and year under it.
// Positions are measured once per render (not per scroll event) so scrolling stays cheap.
const fastEl = $("fast"), fastThumb = $("fastThumb"), fastBubble = $("fastBubble");
let fm = { offs: [], max: 0, top: 0, track: 1 }, fastHide = 0, fastDrag = false, fastRaf = 0, fastMeasure = 0;
const THUMB_H = 56;
function measureFast() {
  cancelAnimationFrame(fastMeasure);
  fastMeasure = requestAnimationFrame(() => {
    const y = window.scrollY;
    fm.offs = [...$("days").children].map((s) => s.getBoundingClientRect().top + y);
    fm.max = Math.max(0, document.documentElement.scrollHeight - innerHeight);
    fm.top = document.querySelector("header").offsetHeight + 4;
    fm.track = Math.max(1, innerHeight - fm.top - 110 - THUMB_H);
    updateFast();
  });
}
function monthAt(y) {
  let lo = 0, hi = fm.offs.length - 1, r = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (fm.offs[m] <= y) { r = m; lo = m + 1; } else hi = m - 1; }
  return groups[r]?.month || "";
}
function updateFast() {
  fastRaf = 0;
  if (fm.max < innerHeight * 1.5) { fastEl.classList.remove("show", "drag"); return; }   // short lists don't need it
  const ty = fm.top + Math.min(1, window.scrollY / fm.max) * fm.track;
  fastThumb.style.transform = `translateY(${ty}px)`;
  fastBubble.style.transform = `translateY(${ty + 10}px)`;
  if (fastDrag) fastBubble.textContent = monthAt(window.scrollY + fm.top + 40);
}
function showFast() {
  if (fm.max < innerHeight * 1.5) return;
  fastEl.classList.add("show");
  clearTimeout(fastHide);
  if (!fastDrag) fastHide = setTimeout(() => fastEl.classList.remove("show"), 2000);
}
window.addEventListener("scroll", () => { showFast(); if (!fastRaf) fastRaf = requestAnimationFrame(updateFast); }, { passive: true });
window.addEventListener("resize", measureFast);
function fastTo(clientY) {
  const r = Math.min(1, Math.max(0, (clientY - fm.top - THUMB_H / 2) / fm.track));
  window.scrollTo(0, r * fm.max);
}
fastThumb.addEventListener("pointerdown", (e) => {
  fastDrag = true; fastEl.classList.add("drag"); clearTimeout(fastHide);
  fastThumb.setPointerCapture(e.pointerId); e.preventDefault(); fastTo(e.clientY);
});
fastThumb.addEventListener("pointermove", (e) => { if (fastDrag) fastTo(e.clientY); });
const fastEnd = () => { if (!fastDrag) return; fastDrag = false; fastEl.classList.remove("drag"); showFast(); };
fastThumb.addEventListener("pointerenter", () => clearTimeout(fastHide));   // don't fade out under the mouse
fastThumb.addEventListener("pointerleave", () => { if (!fastDrag && fastEl.classList.contains("show")) showFast(); });
fastThumb.addEventListener("pointerup", fastEnd); fastThumb.addEventListener("pointercancel", fastEnd);

// ---- sync
$("syncBtn").onclick = async () => {
  try { await api("/api/sync", {}); toast("Copying to PC…"); poll(); } catch (e) { toast(e.message); }
};
$("cancelBtn").onclick = () => api("/api/sync/cancel", {}).then(() => toast("Stopping after the current file"));
async function refresh() {
  toast("Checking the camera…");
  try { status = await api("/api/refresh", {}); lastItemsKey = ""; renderStatus(); toast(status.camera.online ? `${plural(status.on_camera, "file")} on the camera` : "Camera not reachable"); }
  catch (e) { toast(e.message); }
}
$("refreshBtn").onclick = refresh;

// ---- viewer
const fullIds = new Set();   // photos whose full-size original was loaded this session
const exifCache = new Map();
let zoom = { s: 1, x: 0, y: 0 };
const ZOOM_MAX = 6, ZOOM_DOUBLE = 2.5;
function openLb(i) { lbIndex = i; $("lb").classList.add("show"); showLb(); }
function closeLb() { $("lb").classList.remove("show"); clearStage(); showInfo(false); lbIndex = -1; lbId = null; ptrs.clear(); g = null; }
const clearStage = () => $("lbStage").querySelectorAll("img,video").forEach((m) => m.remove());
function lbImg() { return $("lbStage").querySelector("img"); }
function applyZoom(snap) {
  const m = lbImg(); if (!m) return;
  m.classList.toggle("snap", !!snap);
  m.style.transform = zoom.s === 1 && !zoom.x && !zoom.y ? "" : `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`;
}
function clampZoom() {
  const m = lbImg(), st = $("lbStage"); if (!m) return;
  zoom.s = Math.min(ZOOM_MAX, Math.max(1, zoom.s));
  const mx = Math.max(0, (m.offsetWidth * zoom.s - st.clientWidth) / 2), my = Math.max(0, (m.offsetHeight * zoom.s - st.clientHeight) / 2);
  zoom.x = Math.min(mx, Math.max(-mx, zoom.x)); zoom.y = Math.min(my, Math.max(-my, zoom.y));
  if (zoom.s === 1) zoom.x = zoom.y = 0;
}
function resetZoom() { zoom = { s: 1, x: 0, y: 0 }; applyZoom(false); }
// Zoom to scale s keeping the stage point (px, py), measured from the stage centre, where it is.
function zoomAt(s, px, py) {
  const k = Math.min(ZOOM_MAX, Math.max(1, s)) / zoom.s;
  zoom.x = px - (px - zoom.x) * k; zoom.y = py - (py - zoom.y) * k; zoom.s *= k;
  clampZoom();
}
function showLb() {
  const list = visible(), it = list[lbIndex]; if (!it) return closeLb();
  lbId = it.id;
  zoom = { s: 1, x: 0, y: 0 };
  clearStage();
  let m;
  if (it.kind === "video") {
    m = document.createElement("video"); m.controls = true; m.playsInline = true; m.preload = "none";
    m.poster = `/preview/${it.id}`; m.src = `/media/${it.id}`;
  } else {
    m = document.createElement("img"); m.alt = it.name; m.draggable = false;
    m.src = fullIds.has(it.id) ? `/media/${it.id}` : `/preview/${it.id}`;
    m.onerror = () => { m.onerror = null; m.src = `/thumb/${it.id}`; };   // no preview cached and the camera is away
  }
  $("lbStage").prepend(m);
  const nm = $("lbName"); nm.textContent = it.name;
  const add = (t) => { const sm = document.createElement("small"); sm.textContent = t; nm.appendChild(sm); };
  if (it.dateKnown && it.date) add(fmtDateTime(it.date));
  add(`${fmtBytes(it.size)}${it.kind === "video" && it.dur ? " · " + fmtDur(it.dur) : ""} · ${isSaved(it) ? "on the PC" : "on the camera"} · ${lbIndex + 1} of ${list.length}`);
  $("lbDl").href = `/media/${it.id}?dl`;
  $("lbOpen").href = `/media/${it.id}`;
  $("lbPrev").hidden = lbIndex === 0; $("lbNext").hidden = lbIndex === list.length - 1;
  updateLbButtons();
  if (!$("lbInfo").hidden) fillInfo(it);
  [list[lbIndex - 1], list[lbIndex + 1]].forEach((n) => { if (n && n.kind === "photo") new Image().src = `/preview/${n.id}`; });   // warm the neighbours
}
function updateLbButtons() {
  const it = byId.get(lbId); if (!it) return;
  const online = !!status?.camera.online, busy = !!status?.sync.running;
  $("lbSave").hidden = isSaved(it);
  $("lbSave").disabled = busy || !online;
  setFullBtn(it, $("lbFull").dataset.loading === "1");
}
const step = (d) => { const n = lbIndex + d; if (n >= 0 && n < visible().length) { lbIndex = n; showLb(); } };
$("lbPrev").onclick = () => step(-1); $("lbNext").onclick = () => step(1); $("lbClose").onclick = closeLb;
$("lbSave").onclick = async () => {
  const it = byId.get(lbId); if (!it) return;
  try { const r = await api("/api/sync", { ids: [it.id] }); toast(r.started ? "Copying to PC…" : "A copy is already running"); poll(); } catch (e) { toast(e.message); }
};

// Full size: the preview is shown first; the original (/media/<id>, several MB; the PC saves it from the camera first
// if it isn't there yet) loads on request.
function setFullBtn(it, loading) {
  const b = $("lbFull");
  b.dataset.loading = loading ? "1" : "";
  b.hidden = !(it.kind === "photo" && !fullIds.has(it.id));
  b.disabled = loading || (!isSaved(it) && !status?.camera.online);
  b.replaceChildren();
  if (loading) { const sp = document.createElement("span"); sp.className = "spin"; b.append(sp, "Loading full size…"); }
  else b.textContent = `Full size · ${fmtBytes(it.size)}`;
}
$("lbFull").onclick = () => {
  const it = byId.get(lbId), m = lbImg(); if (!it || !m) return;
  setFullBtn(it, true);
  const big = new Image();
  big.onload = () => {
    fullIds.add(it.id);
    if (lbId !== it.id) return;
    m.onerror = null; m.src = `/media/${it.id}`; resetZoom(); setFullBtn(it, false);
    loadItems();
  };
  big.onerror = () => { if (lbId === it.id) { setFullBtn(it, false); toast("Couldn't load the full size"); } };
  big.src = `/media/${it.id}`;
};

// Gestures on the stage: pinch / wheel / ctrl-wheel to zoom, drag to pan when zoomed, double-tap or double-click 1x/2.5x,
// swipe (touch) to change photo at 1x.
const ptrs = new Map();
let g = null, lastTap = null;
const stagePt = (e) => { const r = $("lbStage").getBoundingClientRect(); return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2, w: r.width, h: r.height }; };
$("lbStage").addEventListener("pointerdown", (e) => {
  if (e.target.closest(".lb-nav")) return;
  const st = stagePt(e), vid = $("lbStage").querySelector("video");
  if (vid && st.y > st.h / 2 - 90) return;                  // leave the video's controls alone
  if (e.pointerType === "mouse" && e.button !== 0) return;
  try { $("lbStage").setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) g = { x0: e.clientX, y0: e.clientY, t0: Date.now(), moved: false, pinched: false };
  else if (ptrs.size === 2 && g) {
    const [a, b] = [...ptrs.values()];
    Object.assign(g, { pinched: true, dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: zoom.s });
  }
});
$("lbStage").addEventListener("pointermove", (e) => {
  const p = ptrs.get(e.pointerId); if (!p || !g) return;
  const px = p.x, py = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 8) g.moved = true;
  if (ptrs.size >= 2 && lbImg()) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const r = $("lbStage").getBoundingClientRect();
    zoomAt(g.s0 * d / g.dist, (a.x + b.x) / 2 - r.left - r.width / 2, (a.y + b.y) / 2 - r.top - r.height / 2);
    // the midpoint moves by half of this pointer's movement
    zoom.x += (e.clientX - px) / 2; zoom.y += (e.clientY - py) / 2;
    clampZoom(); applyZoom(false);
  } else if (zoom.s > 1 && lbImg()) {
    zoom.x += e.clientX - px; zoom.y += e.clientY - py;
    clampZoom(); applyZoom(false);
  }
});
function endPtr(e, cancelled) {
  if (!ptrs.delete(e.pointerId) || !g) return;
  if (ptrs.size > 0) { g.moved = true; g.pinched = true; return; }
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0, wasPinch = g.pinched, moved = g.moved, quick = Date.now() - g.t0 < 350;
  g = null;
  if (cancelled) return;
  if (zoom.s < 1.05) { zoom = { s: 1, x: 0, y: 0 }; applyZoom(true); }
  if (wasPinch) return;
  if (!moved && quick) {                                    // a tap or click; two close together make a double-tap
    const now = Date.now(), st = stagePt(e);
    if (lastTap && now - lastTap.t < 400 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      lastTap = null;
      if (lbImg()) { if (zoom.s > 1) zoom = { s: 1, x: 0, y: 0 }; else zoomAt(ZOOM_DOUBLE, st.x, st.y); applyZoom(true); }
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
    return;
  }
  if (e.pointerType !== "mouse" && zoom.s === 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) step(dx < 0 ? 1 : -1);
}
$("lbStage").addEventListener("pointerup", (e) => endPtr(e, false));
$("lbStage").addEventListener("pointercancel", (e) => endPtr(e, true));
$("lbStage").addEventListener("wheel", (e) => {
  if (!lbImg()) return;
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1), st = stagePt(e);
  zoomAt(zoom.s * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002)), st.x, st.y);
  if (zoom.s < 1.02) zoom = { s: 1, x: 0, y: 0 };
  applyZoom(false);
}, { passive: false });

// Details: name, date, size, dimensions, then EXIF from the photo (the PC reads it from the library, or streams just
// the start of the camera's original).
const fmtShutter = (t) => t >= 1 ? `${+t.toFixed(1)} s` : `1/${Math.round(1 / t)} s`;
const exifTaken = (t) => { const m = /^(\d+):(\d+):(\d+) (\d+):(\d+)/.exec(t || ""); return m ? fmtDateTime(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime()) : ""; };
const fmtNum = (n, d = 1) => String(+n.toFixed(d));
function showInfo(on) {
  $("lbInfo").hidden = !on; $("lbInfoBtn").setAttribute("aria-expanded", on);
  if (on) { const it = byId.get(lbId); if (it) fillInfo(it); }
}
$("lbInfoBtn").onclick = () => showInfo($("lbInfo").hidden);
$("lbInfoClose").onclick = () => showInfo(false);
async function fillInfo(it) {
  const dl = $("lbInfoList"), note = $("lbInfoNote");
  const rows = (x) => {
    dl.replaceChildren();
    for (const [k, v] of x) {
      if (v == null || v === "") continue;
      const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k;
      if (typeof v === "object") { const a = document.createElement("a"); a.href = v.href; a.textContent = v.text; a.target = "_blank"; a.rel = "noopener"; dd.append(a); }
      else dd.textContent = v;
      dl.append(dt, dd);
    }
  };
  const base = [["Name", it.name], ["Taken", it.dateKnown && it.date ? fmtDateTime(it.date) : ""], ["Size", fmtBytes(it.size)],
    ["Dimensions", it.w && it.h ? `${it.w} × ${it.h}` : ""], ["Length", it.kind === "video" && it.dur ? fmtDur(it.dur) : ""],
    ["Where", isSaved(it) ? "On the PC" : "On the camera"]];
  rows(base); note.hidden = true;
  if (it.kind !== "photo") return;
  let ex = exifCache.get(it.id);
  if (!ex) {
    if (!isSaved(it) && !status?.camera.online) { note.hidden = false; note.textContent = "Camera details aren't available while the camera is off."; return; }
    note.hidden = false; note.textContent = "Reading details…";
    try { ex = await api(`/api/exif/${it.id}`); exifCache.set(it.id, ex); }
    catch (e) { if (lbId === it.id) note.textContent = e.message || "Couldn't read the camera details."; return; }
  }
  if (lbId !== it.id || $("lbInfo").hidden) return;
  note.hidden = true;
  const focal = ex.focal ? `${fmtNum(ex.focal)} mm${ex.focal35 ? ` (${ex.focal35} mm equiv.)` : ""}` : "";
  const dims = ex.width ? `${ex.width} × ${ex.height}` : "";
  const taken = exifTaken(ex.taken);
  const out = base.map((r) => r[0] === "Dimensions" && dims ? ["Dimensions", dims] : r[0] === "Taken" && taken ? ["Taken", taken] : r);
  const i = out.findIndex((r) => r[0] === "Where");
  const loc = ex.lat != null && ex.lon != null
    ? { text: `${ex.lat.toFixed(5)}, ${ex.lon.toFixed(5)}`, href: `https://www.openstreetmap.org/?mlat=${ex.lat}&mlon=${ex.lon}#map=16/${ex.lat}/${ex.lon}` } : "";
  out.splice(i, 0, ["Camera", ex.model], ["Lens", ex.lens], ["Focal length", focal], ["Aperture", ex.aperture ? `f/${fmtNum(ex.aperture)}` : ""],
    ["Shutter", ex.shutter ? fmtShutter(ex.shutter) : ""], ["ISO", ex.iso ? String(ex.iso) : ""],
    ["Exposure comp.", ex.expComp != null ? `${ex.expComp > 0 ? "+" : ""}${fmtNum(ex.expComp)} EV` : ""],
    ["Flash", ex.flash == null ? "" : ex.flash ? "Fired" : "Didn't fire"], ["Location", loc]);
  rows(out);
}

// ---- keyboard: arrows in the viewer; Esc closes the topmost thing (details, viewer, sort menu, select mode, search)
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || $("settings").open) return;
  const typing = e.target.closest?.("input, textarea");
  if (e.key === "Escape") {
    if (!$("lbInfo").hidden) showInfo(false);
    else if (lbIndex >= 0) closeLb();
    else if (!$("sortMenu").hidden) showSortMenu(false);
    else if (selecting) setSelecting(false);
    else if (!$("searchBar").hidden) toggleSearch();
    else return;
    e.preventDefault();
  } else if (lbIndex >= 0 && !typing) {
    if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
    else if (e.key === "i") showInfo($("lbInfo").hidden);
    else if (e.key === "+" || e.key === "=") { zoomAt(zoom.s * 1.5, 0, 0); applyZoom(true); }
    else if (e.key === "-") { zoomAt(zoom.s / 1.5, 0, 0); applyZoom(true); }
    else if (e.key === "0") resetZoom();
  }
});

// ---- settings
function applyTheme() {
  const pref = pick(store.get("theme", "system"), ["system", "light", "dark"], "system");
  const dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (pref === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = pref;
  $("themeMeta").content = dark ? "#111214" : "#f6f5f2";
  setSegState($("themeSeg"), "t", pref);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
$("themeSeg").addEventListener("click", (e) => { const t = e.target.closest("button")?.dataset.t; if (t) { store.set("theme", t); applyTheme(); } });
applyTheme();
$("settingsBtn").onclick = () => {
  $("ipIn").value = status?.camera.ip || ""; $("libPath").textContent = status?.library.path || ""; $("findOut").textContent = "";
  $("settings").showModal();
};
$("findBtn").onclick = async () => {
  const b = $("findBtn"), out = $("findOut");
  b.disabled = true; b.textContent = "Looking…"; out.textContent = "Checking the camera, then the rest of your network…";
  try {
    const r = await api("/api/find", {});
    out.textContent = r.message;
    if (r.ip) $("ipIn").value = r.ip;
    poll();
  } catch (e) { out.textContent = e.message; }
  b.disabled = false; b.textContent = "Find camera";
};
$("settings").addEventListener("close", async () => {
  if ($("settings").returnValue !== "save") return;
  try { await api("/api/settings", { camera_ip: $("ipIn").value }); toast("Saved. Looking for the camera…"); poll(); } catch (e) { toast(e.message); }
});

poll();
</script>
</body>
